name: Publish to MCP Registry (OIDC)

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub Actions OIDC.
#
# THIS FILE IS TRACKED HERE BUT RUNS IN THE PUBLIC MIRROR.
# It existed only in Shrike-Security/shrike-mcp and was untracked in this
# monorepo, which made it a deletion waiting to happen: release-sdk.sh syncs
# the mirror by clearing the working tree except .git and copying an
# allow-list that includes .github, so the next `release-sdk.sh mcp
# --sync-public` would have removed a workflow nothing here recorded. Keeping
# it under platform/mcp means the sync COPIES it instead of deleting it, and
# the monorepo is the single source of truth for everything in the mirror —
# the same arrangement the three SDK mirrors have, which carry no workflows of
# their own at all.
#
# Do not move this job into the monorepo's own .github/workflows. npm
# publishing moved here deliberately; the MCP registry step did not, and
# whether a private-repo OIDC identity satisfies the registry's namespace
# check is untested. It works where it is.
#
# Why OIDC instead of `mcp-publisher login github` (device flow):
# this workflow runs INSIDE Shrike-Security/shrike-mcp, so its OIDC identity IS
# the org. The registry authorizes the `io.github.Shrike-Security/*` namespace
# structurally — no personal access token, no org OAuth-app approval, no
# membership-visibility settings to fight (all of which blocked the CLI path).
#
# Prereqs (already true):
#   - server.json at repo root, name = io.github.Shrike-Security/shrike-mcp
#   - the npm package `shrike-mcp` at server.json's version is published AND
#     carries a matching `mcpName` field (ownership marker). The registry
#     verifies both before accepting the entry.
#
# Run: Actions tab -> "Publish to MCP Registry (OIDC)" -> Run workflow.

on:
  # Dispatch only, and dispatched by scripts/release-sdk.sh (step 4b) right
  # after it syncs this mirror.
  #
  # A `release: types: [published]` trigger used to sit here, claiming the
  # registry version could never drift from the tagged release again. It never
  # fired once. It listens for a release in THIS repository, and the release
  # flow pushes commits here (release-sdk.sh step 4, `git push origin HEAD`)
  # without ever creating one — this mirror has had a single release in its
  # whole history. So the registry was updated by hand for months behind a
  # trigger that read as automation. Removed rather than left as a comfort.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED: lets the job mint the OIDC token mcp-publisher uses

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version || true

      - name: Authenticate (GitHub OIDC — proves org ownership)
        run: mcp-publisher login github-oidc

      # NOTE: mcp-publisher's `publish --dry-run` is NOT a no-op with this CLI
      # build — it performs the real publish. So we run a single publish and
      # treat "duplicate version" as success (idempotent re-runs of an unchanged
      # server.json version should not fail the workflow).
      - name: Publish to the MCP Registry
        run: |
          set +e
          out="$(mcp-publisher publish 2>&1)"; code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -qi "duplicate version"; then
            echo "::notice::Version already present in the registry — nothing to publish."
            exit 0
          fi
          exit $code

      - name: Verify the registry entry
        run: |
          set -euo pipefail
          echo "Current registry entry:"
          curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=shrike" \
            | grep -o '"version":"[^"]*"' | head -5
